name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Lint & format
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install ruff black mypy

      - name: ruff (lint)
        run: ruff check .

      - name: black (format check)
        run: black --check .

      - name: mypy (type check)
        run: mypy spark/ data_generator/ kafka/ config/ --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Unit tests (no external services required)
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Java (required for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            -v \
            --timeout=120 \
            --cov=spark \
            --cov=data_generator \
            --cov-report=xml \
            --cov-report=term-missing \
            -x

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Integration tests (requires Docker services)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      minio:
        image: minio/minio:RELEASE.2024-01-18T22-51-28Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create MinIO bucket
        run: |
          pip install minio
          python -c "
          from minio import Minio
          client = Minio('localhost:9000', access_key='minioadmin', secret_key='minioadmin', secure=False)
          if not client.bucket_exists('datalake'):
              client.make_bucket('datalake')
          print('Bucket ready')
          "

      - name: Run integration tests
        env:
          INTEGRATION_TESTS: "1"
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        run: |
          pytest tests/ \
            -v \
            --timeout=300 \
            -m integration \
            -x

  # ---------------------------------------------------------------------------
  # Validate Airflow DAGs (import check — catches syntax errors)
  # ---------------------------------------------------------------------------
  airflow-dag-validation:
    name: Airflow DAG Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Airflow
        run: |
          pip install apache-airflow==2.9.2 \
            apache-airflow-providers-apache-spark==4.7.0

      - name: Validate DAG imports
        run: |
          python -c "
          import importlib, sys, pathlib
          sys.path.insert(0, '.')
          dag_files = list(pathlib.Path('airflow/dags').glob('*.py'))
          for f in dag_files:
              spec = importlib.util.spec_from_file_location(f.stem, f)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              print(f'OK: {f.name}')
          "
